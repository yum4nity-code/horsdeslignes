<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C'est noté ! · Hors des Lignes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--lav:#c7b6f2;--ink:#1e1432;--paper:#fffdf7;--pink:#ff5fa2;--yellow:#ffd23f}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--lav);line-height:1.55;font-size:17px}
header{border-bottom:3px solid var(--ink);padding:14px 20px;background:var(--lav)}
header a{font-weight:800;text-decoration:none;color:var(--ink)}
main{max-width:720px;margin:32px auto 60px;padding:0 20px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.card img{display:block;width:100%;height:auto;border-bottom:3px solid var(--ink)}
.body{padding:24px 26px 30px;text-align:center}
h1{font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0 0 12px}
p{margin:0 0 14px}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;font-weight:800;text-decoration:none;color:var(--ink);padding:12px 20px;border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);background:var(--yellow)}
.btn.pink{background:var(--pink);color:#fff}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
</style>
<script data-goatcounter="https://leomarge.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header><a href="/">← Hors des Lignes</a></header>
<main>
  <div class="card">
    <img src="/img/lord-wasabi-lettre.jpg" alt="Lord Wasabi, en haori, écrit une lettre à la plume à son bureau" width="1024" height="572">
    <div class="body">
      <h1>C'est noté&nbsp;!</h1>
      <p>Lord Wasabi a pris ton e-mail. Il t'écrira <strong>le 1er décembre</strong>, le jour de sa sortie.</p>
      <p>En attendant, viens le voir sur les réseaux, ou découvre quel survivant tu es.</p>
      <div class="ctas">
        <a class="btn pink" href="https://www.instagram.com/hors.deslignes/" rel="noopener">Instagram</a>
        <a class="btn" href="https://www.tiktok.com/@horsdelignes" rel="noopener">TikTok</a>
        <a class="btn" href="/quiz/">Faire le test</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
